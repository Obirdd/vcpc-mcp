# DSH desktop profile cordis.patch.yml: append to the existing top-level array.
# Replace paths, alias and team; first check the shared budget and profile ledger.
# Ceilings below authorize no new contest or training on a fresh profile.
- insert:
    - id: mcp-vcpc
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: vcpc
        transport: stdio
        command: /absolute/path/to/node
        args:
          - '/absolute/path/to/vcpc-mcp/dist/server.js'
        cwd: '/absolute/path/to/vcpc-mcp'
        env:
          VCPC_PROFILE_ALIAS: my-team
          VCPC_EXPECTED_TEAM: 'My VCPC Team'
          VCPC_HEADED: '1'
          VCPC_MAX_CONTESTS: '0'
          VCPC_TRAINING_TP_BUDGET: '0'
        toolCallTimeoutMs: 180000
        failOnStartupError: true
